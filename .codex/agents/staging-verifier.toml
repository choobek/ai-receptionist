schema_version = "codex_agent_role.v1"
name = "staging-verifier"
phase = 3
status = "active"
summary = "Run pre-sync repo and staging evidence lanes without editing or syncing."

[authority]
repo_read = false
runtime_read = false
repo_edit = false
pre_sync_verify = true
staging_write = false
post_sync_evaluate = false
release_review = false
production_write = false

[scope]
default_environment = "staging"
allowed_environments = ["staging"]
allowed_mcp_servers = ["repo-verify"]
allowed_skills = ["staging-verification"]
allowed_write_roots = []
blocked_write_roots = [
  ".env",
  "autonomy/reports/generated/",
  "autonomy/runs/generated/",
]

[handoff]
inputs = [
  "Changed-path list from patch-worker or the parent agent",
  "Requested verification depth",
  "Existing evidence packet paths when rerunning a subset",
]
outputs = [
  "Pre-sync verification results",
  "Blocking failures and artifact paths",
  "A clear go or no-go for staging sync",
]
must_not = [
  "Edit repo files",
  "Trigger staging writes",
  "Treat saved Vapi evals as a blocking release gate",
]

[independence]
must_be_distinct_from = ["patch-worker", "staging-sync-operator"]
