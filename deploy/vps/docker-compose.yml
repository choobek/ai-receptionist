services:
  caddy:
    image: caddy:2
    container_name: ${CADDY_CONTAINER_NAME:-ai-receptionist-caddy}
    restart: unless-stopped
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - CADDY_ADMIN_USER=${CADDY_ADMIN_USER}
      - CADDY_ADMIN_PASSWORD_HASH=${CADDY_ADMIN_PASSWORD_HASH}
      - CALENDAR_GATEWAY_UPSTREAM=${CALENDAR_GATEWAY_UPSTREAM:-ai-receptionist-calendar-gateway:3000}
    depends_on:
      - n8n
      - calendar-gateway
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy.d:/etc/caddy/caddy.d:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - shared_edge

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.7.4
    container_name: ${N8N_CONTAINER_NAME:-ai-receptionist-n8n}
    restart: unless-stopped
    depends_on:
      - calendar-gateway
    expose:
      - "5678"
    environment:
      - AI_RECEPTIONIST_DEPLOY_ENV=${AI_RECEPTIONIST_DEPLOY_ENV}
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_EDITOR_BASE_URL=https://${N8N_DOMAIN}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS}
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE}
      - AI_RECEPTIONIST_WEBHOOK_SECRET=${AI_RECEPTIONIST_WEBHOOK_SECRET}
      - AI_RECEPTIONIST_SMS_PROVIDER=${AI_RECEPTIONIST_SMS_PROVIDER}
      - AI_RECEPTIONIST_SMS_WEBHOOK_URL=${AI_RECEPTIONIST_SMS_WEBHOOK_URL}
      - AI_RECEPTIONIST_SMS_WEBHOOK_BEARER_TOKEN=${AI_RECEPTIONIST_SMS_WEBHOOK_BEARER_TOKEN}
      - AI_RECEPTIONIST_SMS_WEBHOOK_TIMEOUT_MS=${AI_RECEPTIONIST_SMS_WEBHOOK_TIMEOUT_MS}
      - AI_RECEPTIONIST_ASSISTANT_TOOL_TIMEOUT_MS=${AI_RECEPTIONIST_ASSISTANT_TOOL_TIMEOUT_MS}
      - AI_RECEPTIONIST_BOOKING_SMS_MODE=${AI_RECEPTIONIST_BOOKING_SMS_MODE}
      - AI_RECEPTIONIST_SMS_SENDER=${AI_RECEPTIONIST_SMS_SENDER}
      - AI_RECEPTIONIST_RECEPTION_SMS_RECIPIENTS=${AI_RECEPTIONIST_RECEPTION_SMS_RECIPIENTS}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - CLINIC_NAME=${CLINIC_NAME}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - GOOGLE_CALENDAR_CONNECTION_ID=${GOOGLE_CALENDAR_CONNECTION_ID}
      - CALENDAR_GATEWAY_INTERNAL_BASE_URL=${CALENDAR_GATEWAY_INTERNAL_BASE_URL}
      - CALENDAR_GATEWAY_INTERNAL_API_KEY=${CALENDAR_GATEWAY_INTERNAL_API_KEY}
      - CLINIC_WORKING_HOURS_START=${CLINIC_WORKING_HOURS_START}
      - CLINIC_WORKING_HOURS_END=${CLINIC_WORKING_HOURS_END}
      - DEFAULT_APPOINTMENT_DURATION_MINUTES=${DEFAULT_APPOINTMENT_DURATION_MINUTES}
      - DEFAULT_SLOT_INCREMENT_MINUTES=${DEFAULT_SLOT_INCREMENT_MINUTES}
      - DEFAULT_SLOT_SEARCH_LIMIT=${DEFAULT_SLOT_SEARCH_LIMIT}
      - VAPI_STRUCTURED_OUTPUT_ID=${VAPI_STRUCTURED_OUTPUT_ID}
    volumes:
      - n8n_data:/home/node/.n8n

  calendar-gateway:
    build:
      context: ../../calendar-gateway
    container_name: ${CALENDAR_GATEWAY_CONTAINER_NAME:-ai-receptionist-calendar-gateway}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - CLINIC_NAME=${CLINIC_NAME}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - GOOGLE_CALENDAR_CONNECTION_ID=${GOOGLE_CALENDAR_CONNECTION_ID}
      - CALENDAR_GATEWAY_DATA_DIR=${CALENDAR_GATEWAY_DATA_DIR}
      - CALENDAR_GATEWAY_PUBLIC_BASE_URL=${CALENDAR_GATEWAY_PUBLIC_BASE_URL}
      - CALENDAR_GATEWAY_INTERNAL_API_KEY=${CALENDAR_GATEWAY_INTERNAL_API_KEY}
      - CALENDAR_GATEWAY_CONNECT_TOKEN=${CALENDAR_GATEWAY_CONNECT_TOKEN}
      - CALENDAR_GATEWAY_ENCRYPTION_KEY=${CALENDAR_GATEWAY_ENCRYPTION_KEY}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_SCOPES=${GOOGLE_OAUTH_SCOPES}
    volumes:
      - calendar_gateway_data:${CALENDAR_GATEWAY_DATA_DIR:-/data}

volumes:
  caddy_data:
    name: ${CADDY_DATA_VOLUME_NAME:-ai-receptionist-caddy-data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-ai-receptionist-caddy-config}
  n8n_data:
    name: ${N8N_DATA_VOLUME_NAME:-ai-receptionist-n8n-data}
  calendar_gateway_data:
    name: ${CALENDAR_GATEWAY_DATA_VOLUME_NAME:-ai-receptionist-calendar-gateway-data}

networks:
  shared_edge:
    external: true
    name: ${SHARED_EDGE_NETWORK_NAME:-ai-receptionist-shared-edge}
