version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.7.4
    container_name: ai-receptionist-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE}
      - CLINIC_NAME=${CLINIC_NAME}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE}
      - GOOGLE_CALENDAR_ID=${GOOGLE_CALENDAR_ID}
      - CLINIC_WORKING_HOURS_START=${CLINIC_WORKING_HOURS_START}
      - CLINIC_WORKING_HOURS_END=${CLINIC_WORKING_HOURS_END}
      - DEFAULT_APPOINTMENT_DURATION_MINUTES=${DEFAULT_APPOINTMENT_DURATION_MINUTES}
      - DEFAULT_SLOT_INCREMENT_MINUTES=${DEFAULT_SLOT_INCREMENT_MINUTES}
      - DEFAULT_SLOT_SEARCH_LIMIT=${DEFAULT_SLOT_SEARCH_LIMIT}
      - VAPI_STRUCTURED_OUTPUT_ID=${VAPI_STRUCTURED_OUTPUT_ID}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
